# Model registry for mlx-lazyserve.
# Friendly name -> Hugging Face MLX repo. Weights download lazily on first use
# (cached in ~/.cache/huggingface) and unload after the idle timeout.
#
#   engine = "auto"     try mlx-lm, fall back to mlx-vlm  (good default)
#            "mlx_lm"   force the text engine
#            "mlx_vlm"  force the vision-language engine (required for image input)
#   context = 32768     context window in tokens (default 8192). The Telegram bot trims
#                       old history so the prompt + reserved output stay within this.
#   enable_thinking = true      API reasoning default for this model (default false); a
#                               per-request enable_thinking still overrides it.
#   tg_enable_thinking = true   Telegram-bot reasoning default (default false); a user's
#                               /think toggle still overrides it. Independent of enable_thinking.

# --- The one model. Sized to own the whole 24 GiB box; needs iogpu.wired_limit_mb=22000 ---
[models."qwen3.8-27b"]
# Qwen 3.8 27B (dense), "Heretic" abliteration, MLX 4-bit, ~15 GiB on disk.
# Dense, so every token activates all 27B params: ~14 tok/s on an M4 Pro (16 GPU cores).
# The idle-unload frees the ~19 GiB working set when not in use, which is most of this
# 24 GiB box — that reclaim is the whole point of the lazy-load design.
repo = "TheCluster/Qwen3.8-27B-Heretic-MLX-4bit"
default = true
# The build ships the vision + video preprocessors, so the weights are multimodal-capable:
# "auto" takes mlx-lm's text path (verified — it loads, no mlx-vlm fallback). Force "mlx_vlm"
# if you want image input to actually work, at the cost of the faster text path.
engine = "auto"
# Context ceilings, in order: 262144 (256k) native — this build's max_position_embeddings,
# with rope_type still "default" — and 1M only after switching rope_parameters to YaRN
# (factor 4.0), which the model card supports on vLLM/SGLang/TokenSpeed but NOT MLX.
# Both are academic here: the wired limit binds long before either.
# KV is cheap: only 16 of 64 layers use full attention (interval 4), and 4 KV heads x 256
# head_dim is ~32 KiB/token at the 8-bit KV this server runs. So:
#   128k  -> 4.0 GiB KV  + 15.0 GiB weights = 19.0 GiB, ~2.5 GiB left for prefill activations
#   160k  -> 5.0 GiB KV                     = 20.0 GiB, too tight to be safe
#   256k  -> 8.0 GiB KV                     = 23.0 GiB, over the 21.5 GiB limit
# 128k it is. Raising this further means dropping to 4-bit KV (halves the per-token cost).
context = 131072
# Thinking ON by default on both surfaces — this is also the model's own documented default
# ("Thinking mode is on by default and can be disabled per request"). It costs real
# wall-clock at 14 tok/s, and <think> shares the output budget with the answer, so both
# MAX_TOKENS settings are sized for that. Disable per request with enable_thinking:false,
# or per user with the bot's /think toggle.
enable_thinking = true       # API default
tg_enable_thinking = true    # Telegram-bot default
